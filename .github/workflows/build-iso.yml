name: Build and Release ISO

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo into config/
        uses: actions/checkout@v4
        with:
          path: build/config

      - name: Install live-build and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap xorriso wget debian-archive-keyring
          LB_DEB_URL=$(curl -s http://deb.debian.org/debian/pool/main/l/live-build/ | grep -oP 'live-build_[^"]+_all\.deb' | sort -V | tail -n1)
          wget "http://deb.debian.org/debian/pool/main/l/live-build/${LB_DEB_URL}"
          sudo apt-get install -y "./${LB_DEB_URL}"
          lb --version

      - name: Configure live-build
        working-directory: build
        run: |
          sudo lb config \
            --distribution trixie \
            --archive-areas "main contrib non-free non-free-firmware" \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --bootloaders "syslinux,grub-efi" \
            --debian-installer live \
            --bootappend-live "boot=live components quiet splash" \
            --mirror-bootstrap http://deb.debian.org/debian/ \
            --mirror-binary http://deb.debian.org/debian/

      - name: Run live-build
        working-directory: build
        run: |
          sudo lb build

      - name: Locate built ISO
        id: find_iso
        run: |
          ISO_PATH=$(find build -maxdepth 2 -iname "*.iso" | head -n 1)
          if [ -z "$ISO_PATH" ]; then
            echo "No ISO found after build" >&2
            exit 1
          fi
          echo "iso_path=$ISO_PATH" >> "$GITHUB_OUTPUT"
          echo "iso_name=$(basename "$ISO_PATH")" >> "$GITHUB_OUTPUT"

      - name: Generate SHA256 checksum
        id: checksum
        run: |
          cd "$(dirname "${{ steps.find_iso.outputs.iso_path }}")"
          sha256sum "${{ steps.find_iso.outputs.iso_name }}" > "${{ steps.find_iso.outputs.iso_name }}.sha256"
          echo "checksum_path=$(pwd)/${{ steps.find_iso.outputs.iso_name }}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload ISO to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          ENDPOINT="${{ secrets.R2_ENDPOINT }}"
          STAGING_KEY="iso/infinityOS-amd64.iso.uploading"
          FINAL_KEY="iso/infinityOS-amd64.iso"

          # Upload to a staging key, then do a server-side copy onto the live
          # key, so files.jotalea.com.ar/iso/infinityOS-amd64.iso is only ever
          # repointed once the full ISO has landed successfully in R2.
          #
          # The copy uses `s3api copy-object`, not `s3 cp`: R2 doesn't implement
          # the S3 tagging API, and `s3 cp`'s multipart-copy path calls
          # GetObjectTagging first to carry tags over, which R2 rejects with
          # NotImplemented. copy-object issues a single CopyObject request
          # (our file is well under the 5GiB single-copy limit) whose tag
          # handling is done server-side, so it never touches that endpoint.
          aws s3 cp "${{ steps.find_iso.outputs.iso_path }}" "s3://files/${STAGING_KEY}" --endpoint-url "$ENDPOINT"
          aws s3api copy-object --endpoint-url "$ENDPOINT" --bucket files --copy-source "files/${STAGING_KEY}" --key "$FINAL_KEY"
          aws s3 rm "s3://files/${STAGING_KEY}" --endpoint-url "$ENDPOINT"

          aws s3 cp "${{ steps.checksum.outputs.checksum_path }}" "s3://files/iso/infinityOS-amd64.iso.sha256" --endpoint-url "$ENDPOINT"

      - name: Create GitHub Release with checksum
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.checksum.outputs.checksum_path }}
          generate_release_notes: true
          body: |
            ISO download: https://files.jotalea.com.ar/iso/infinityOS-amd64.iso
